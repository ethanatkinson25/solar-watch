<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module" src="/js/checkout.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Solar Watch</title>
  </head>
  <body>
    <header class="main-header" id="main-header">
      
    </header>
    <main>
      <section class="shopping-cart">
        <h1>Your Shopping Cart</h1>
        <ul class="product-list"></ul>
      </section>
      <section class="cart-summary">
        <h2>Cart Summary</h2>
        <p class="total-price">Total: $0.00</p>
        </section>
      <section class="checkout">
        <h2 class="form-title">Checkout</h2>
        <form class="checkout-form">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="address">Address:</label>
          <input type="text" id="address" name="address" required />

          <label for="payment">Payment Details (demo only):</label>
          <input
            type="text"
            id="payment"
            name="payment"
            placeholder="Do not enter real payment information"
            required
          />

          <button type="submit" class="checkout-button"><a href="success.html">Place Order</a></button>
        </form>
      </section>
    </main>
    <footer class="main-footer" id="main-footer">
      
    </footer>
  </body>
</html>
